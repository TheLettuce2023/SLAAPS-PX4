    {
      "group": "SLAAPS Vehicle",
      "definitions": {
        "SLA_DATA_VER": {
          "description": {
            "short": "SLAAPS profile schema version; only version 1 is supported",
            "long": "Operator-declared provenance for an external calibration or qualification record. SLA_DATA_VER identifies the SLAAPS profile schema, not an external artifact format. SLA_DATA_REC identifies the external record and SLA_DATA_REV its revision. Incomplete permits staged commissioning data. Calibrated or Qualified requires a positive record ID and revision. The firmware does not verify that the record exists, authenticate it, or independently verify the operator's assessment. Selecting Qualified never grants flight, measured-condition, session or actuator permission, and does not replace required runtime health and ownership checks. Configure while disabled and deliberately apply the coherent complete profile."
          },
          "type": "int32",
          "min": 1,
          "max": 1,
          "default": 1
        },
        "SLA_DATA_REC": {
          "description": {
            "short": "Operator-declared external data record ID; zero is unassigned",
