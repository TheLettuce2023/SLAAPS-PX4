    {
      "group": "SLAAPS Power",
      "definitions": {
        "SLA_PWR_INST": {
          "description": {
            "short": "Selected propulsion battery instance; -1 is unconfigured",
            "long": "Explicit propulsion battery selection and voltage limits. Configure and apply while disarmed. Stabilized manual and EDF commissioning require the exact battery_status instance, ID, source, positive age limit and ordered positive voltage band. Servo bench may stage incomplete fields. The selected publisher must remain connected, fresh, without warning, fault or imminent power-off, and within the operator-configured voltage band. There is no alternate battery fallback. Age is bounded from the original battery report, not polling time. Zero defaults are unconfigured; the software voltage range is not hardware qualification, a measured thrust-curve condition or flight permission. Do not edit an active profile."
          },
          "type": "enum",
          "min": -1,
          "max": 2,
          "default": -1,
          "values": {
            "-1": "Unconfigured",
            "0": "Battery instance 0",
            "1": "Battery instance 1",
            "2": "Battery instance 2"
          }
        },
        "SLA_PWR_ID": {
          "description": {
            "short": "Exact propulsion battery ID; zero is unconfigured",
            "long": "Explicit propulsion battery selection and voltage limits. Configure and apply while disarmed. Stabilized manual and EDF commissioning require the exact battery_status instance, ID, source, positive age limit and ordered positive voltage band. Servo bench may stage incomplete fields. The selected publisher must remain connected, fresh, without warning, fault or imminent power-off, and within the operator-configured voltage band. There is no alternate battery fallback. Age is bounded from the original battery report, not polling time. Zero defaults are unconfigured; the software voltage range is not hardware qualification, a measured thrust-curve condition or flight permission. Do not edit an active profile."
          },
          "type": "int32",
          "min": 0,
          "max": 255,
          "default": 0
        },
        "SLA_PWR_SRC": {
          "description": {
