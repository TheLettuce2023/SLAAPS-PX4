    {
      "group": "SLAAPS Companion",
      "definitions": {
        "SLA_CMP_EN": {
          "description": {
            "short": "Enable configured companion transport source; no acceleration authority",
            "long": "Companion transport source selection. Configure and apply while disarmed. The exact MAVLink link, signed header system/component and positive 31-bit payload source ID must match. The age limit bounds local packet receipt, not producer command validity. Authentication and source selection do not establish a session, trusted clock mapping, acceleration control or flight permission. Zero age or identity is unconfigured."
          },
          "type": "enum",
          "min": 0,
          "max": 1,
          "default": 0,
          "values": {
            "0": "Disabled",
            "1": "Observe configured companion"
