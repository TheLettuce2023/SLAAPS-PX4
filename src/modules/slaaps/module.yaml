            "long": "Optional empirical control table, disabled by default. Configure and apply the complete profile while disarmed. Coordinates are raw indicated airspeed from the pinned airspeed instance and normalized EDF owner command; neither groundspeed nor inferred thrust is substituted. Corner indices are [IAS low/high][EDF low/high]. Every corner supplies body-rate P/I/D gains and signed moment derivatives about CG; the existing moment normalization and calibrated servo conversion remain fixed. Pinned vehicle_air_data density and battery_status voltage must stay fresh and inside the declared ranges; no density or voltage scaling is inferred. Selectors have no automatic fallback. Filter and raw transient limits must be explicitly configured. Enabling or numerically validating this table establishes neither angle-of-attack/sideslip or EDF-wash coverage nor a qualified envelope, measured coefficients or flight permission. Do not edit an active profile. Optional measured physical affine wrench, declared explicitly by SLA_WR_EN. All vectors use body FRD; moments are about CG. Canard force derivatives are N/rad and reuse the existing signed rad/normalized deflection slopes and moment derivatives. Total nongravitational trim wrench is measured at the configured canard trims and SLA_TEST_THR for the fixed model, or at the shared EDF thrust curve value for that scheduled corner's EDF-command knot. Installed EDF force/N and moment/N include measured installation effects; no unit-vector normalization, lever arm, torque or wash is inferred. Individual measured coefficients may be zero. Interpolate complete affine intercepts and columns at the same filtered schedule coordinates; do not interpolate reference products. Positive force/moment residual tolerances are explicit physical acceptance bounds. Disabled or incomplete wrench data leaves acceleration conversion unavailable without removing Manual or Bench calibration. Declaration, parameter saving and numerical validity do not prove measurement authenticity, operating-envelope coverage or flight/output admission."
