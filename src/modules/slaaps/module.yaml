    {
      "group": "SLAAPS Feedback",
      "definitions": {
        "SLA_FB_EN": {
          "description": {
            "short": "Enable configured CG acceleration feedback; no flight permission",
            "long": "Optional selected acceleration feedback at the CG. Configure and apply while disarmed. All enabled-policy bounds and gravity must be explicit and positive. Original acceleration sample age must exceed declared relative sensor/filter latency. Existing SLA_STATE_SKEW bounds combined raw timestamp skew plus this latency; no duplicate skew limit is supplied. The explicit stable-source settling interval must cover the declared latency and cannot renew any original sample or bias expiry. The 60-second settling range is a software bound, not a measured filter qualification. EKF2_IMU_POS_X/Y/Z already give CG-to-IMU body-FRD offsets and are captured atomically with this profile; SLAAPS does not subtract its separate CG coordinate or define duplicate position parameters. IMU_ACCEL_CUTOFF is captured native intent (zero disables its filter), not proof of the producer's actual applied cutoff. The consumer must check actual source/filter metadata and continuity. Disabled or incomplete feedback does not remove existing Manual or Bench model validity. Configuration, settling and numerical validity confer no flight admission or measured latency/vehicle qualification."
          },
          "type": "enum",
          "min": 0,
          "max": 1,
          "default": 0,
          "values": {
            "0": "Disabled",
            "1": "Configured acceleration feedback"
          }
        },
        "SLA_FB_AGE": {
          "description": {
            "short": "Maximum original acceleration sample age; must exceed latency",
