    {
      "group": "SLAAPS Schedule",
      "definitions": {
        "SLA_SCH_EN": {
          "description": {
            "short": "Enable empirical 2x2 control schedule; never flight qualification",
            "long": "Optional empirical control table, disabled by default. Configure and apply the complete profile while disarmed. Coordinates are raw indicated airspeed from the pinned airspeed instance and normalized EDF owner command; neither groundspeed nor inferred thrust is substituted. Corner indices are [IAS low/high][EDF low/high]. Every corner supplies body-rate P/I/D gains and signed moment derivatives about CG; the existing moment normalization and calibrated servo conversion remain fixed. Pinned vehicle_air_data density and battery_status voltage must stay fresh and inside the declared ranges; no density or voltage scaling is inferred. Selectors have no automatic fallback. Filter and raw transient limits must be explicitly configured. Enabling or numerically validating this table establishes neither angle-of-attack/sideslip or EDF-wash coverage nor a qualified envelope, measured coefficients or flight permission. Do not edit an active profile."
          },
          "type": "enum",
