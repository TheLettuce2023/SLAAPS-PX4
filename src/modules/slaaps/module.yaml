    {
      "group": "SLAAPS Acceleration",
      "definitions": {
        "SLA_ACC_CTL_EN": {
          "description": {
            "short": "Enable configured acceleration and absolute-attitude calculation; no flight permission",
            "long": "Numerical body-FRD inertial CG acceleration and absolute NED-from-body quaternion control. Explicit positive outer proportional gains and correction limits are required; zero is unconfigured. Rotational PID gains and the physical affine wrench use the same filtered empirical IAS/actual EDF-command schedule. Current canards and all six residuals are solved at the current owner command's calibrated thrust, not a future target or measured thrust. No spool, hover, entry-attitude hold, recovery or physical timing qualification is inferred. Incomplete configuration does not disable Manual or Bench. Configuration supplies no authenticated request, measured-condition, flight or actuator permission."
          },
          "type": "enum",
          "min": 0,
          "max": 1,
          "default": 0,
          "values": {
            "0": "Disabled",
            "1": "Configured numerical controller"
          }
        },
        "SLA_ACC_P_X": {
          "description": {
            "short": "Body FRD X outer acceleration proportional correction gain",
