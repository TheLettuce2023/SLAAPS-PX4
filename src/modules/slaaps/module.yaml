    {
      "group": "SLAAPS Configuration",
      "definitions": {
        "SLA_CFG_APPLY": {
          "description": {
            "short": "Apply completed configuration edits",
            "long": "Increase this counter after all vehicle parameters have been edited. Requires disarmed status. Each increase validates one complete snapshot. An unchanged previously accepted snapshot is restored after a disarmed restart. Later edits require another increase. Restoration grants no output permission."
          },
          "type": "int32",
          "min": 0,
          "max": 2147483647,
          "default": 0
        },
        "SLA_CFG_KIND": {
          "description": {
            "short": "Configuration validation scope",
            "long": "Choose the validation scope before increasing SLA_CFG_APPLY. Validation is not flight acceptance or permission to enable outputs."
          },
          "type": "enum",
          "values": {
            "0": "Servo bench",
            "1": "Stabilized manual",
            "2": "EDF commissioning"
          },
          "default": 0
        },
        "SLA_CFG_SAVED": {
          "description": {
            "short": "Accepted configuration apply counter",
            "long": "Supervisor-maintained acceptance marker. Export and restore with all SLAAPS parameters. Do not edit manually. A matching marker permits revalidation after disarmed restart, never arming or output permission."
          },
          "type": "int32",
          "min": -2147483648,
          "max": 2147483647,
          "default": 0
        },
        "SLA_CFG_SCOPE": {
          "description": {
            "short": "Accepted configuration validation scope",
            "long": "Supervisor-maintained acceptance marker. Export and restore with all SLAAPS parameters. Do not edit manually. A matching marker permits revalidation after disarmed restart, never arming or output permission."
          },
          "type": "int32",
          "min": -2147483648,
          "max": 2147483647,
          "default": 0
        },
        "SLA_CFG_ID_LO": {
          "description": {
            "short": "Accepted configuration identity low word",
            "long": "Supervisor-maintained acceptance marker. Export and restore with all SLAAPS parameters. Do not edit manually. A matching marker permits revalidation after disarmed restart, never arming or output permission."
          },
          "type": "int32",
          "min": -2147483648,
          "max": 2147483647,
          "default": 0
        },
        "SLA_CFG_ID_HI": {
          "description": {
            "short": "Accepted configuration identity high word",
            "long": "Supervisor-maintained acceptance marker. Export and restore with all SLAAPS parameters. Do not edit manually. A matching marker permits revalidation after disarmed restart, never arming or output permission."
          },
          "type": "int32",
          "min": -2147483648,
          "max": 2147483647,
          "default": 0
        }
      }
    },
    {
      "group": "SLAAPS Commissioning",
      "definitions": {
        "SLA_BENCH_EN": {
          "description": {
            "short": "Deliberately enable commissioning",
            "long": "Select SLAAPS Bench while disarmed, with an applied commissioning profile, valid routing and centered selected input. Set to 1 only after readiness. Set to 0 to stop. The supervisor resets this command on startup, exit or fault; restoring parameters never enables outputs. Servo targets require PX4 prearm permission and keep EDF inhibited. For EDF target 5, select/apply kind 2 disarmed, observe low throttle/readiness, enable, then deliberately arm through Commander. Controls and original duration remain bound. Disarm, kill or loss stops EDF. This command never grants flight admission."
          },
          "type": "enum",
          "values": {
            "0": "Stop / disabled",
            "1": "Enable commissioning session"
          },
          "default": 0
        },
        "SLA_BENCH_CH": {
          "description": {
            "short": "Commissioning target",
            "long": "Choose before enabling. Combined uses the applied body-axis bench mix. An individual canard uses the configured logical roll input, mapping and reversal; the other canards target physical neutral. All use the shared calibrated travel and slew limits. EDF target 5 parks every canard at physical zero and requires the accepted EDF commissioning profile, positive SLA_EDF_BMAX, low-throttle entry and deliberate armed permission. Changing this selection stops an active session."
          },
          "type": "enum",
          "values": {
            "0": "Combined response",
            "1": "Canard 1",
            "2": "Canard 2",
            "3": "Canard 3",
            "4": "Canard 4",
            "5": "EDF (deliberately armed)"
          },
          "default": 0
        },
        "SLA_BENCH_SEC": {
          "description": {
            "short": "Maximum commissioning session duration",
            "long": "Set a finite duration before deliberately enabling commissioning. Zero denies enable. Expiry stops the session and requires deliberate re-entry. The 60 second software ceiling is not measured hardware qualification. Input freshness, command leases and stop/kill checks remain independently enforced."
          },
          "type": "int32",
          "min": 0,
          "max": 60,
          "default": 0,
          "unit": "s"
        }
      }
    },
    {
      "group": "SLAAPS Companion Actions",
      "definitions": {
        "SLA_CMP_ACT": {
          "description": {
            "short": "Deliberate disarmed companion action",
            "long": "Transient command outside the accepted vehicle profile. All actions require fresh actual disarmed authority. Prepare binds an already-staged authenticated SESSION candidate for bounded clock-map preparation and grants no session authority. Grant independently authorizes only that exact prepared session with a current fresh authenticated SESSION. Revoke closes the current trusted session; clear only clears a latch and never grants a session or acknowledgment. The supervisor resets this command on startup and after consumption, including rejection. Saved commands cannot restore authority. No action enables a flight controller or outputs; missing configuration, state, clock or bindings deny the action."
          },
          "type": "enum",
          "values": {
            "0": "None",
            "1": "Prepare staged authenticated session",
            "2": "Grant exact prepared session",
            "3": "Revoke session",
            "4": "Clear latched fault"
          },
          "default": 0
        }
      }
    }
  ]
}
