            "long": "Companion source and optional request-admission policy. Configure and apply while disarmed. The exact MAVLink link, signed header system/component and positive 31-bit payload source ID must match. SLA_CMP_AGE bounds local receipt, independently of raw request validity and conservative command age. Admission is disabled by default; enabled admission requires explicit acceleration, timing and clock bounds, disarmed policy and shared SLA_QUAT_TOL. Acceleration is inertial at CG in body FRD, never specific force or an actuator demand. Zero required bounds are unconfigured. Use separate deliberate SLA_CMP_ACT actions for preparation, grant, revoke and latch clear. Saved configuration, authentication and valid numbers establish neither a trusted session/map nor a qualified clock, acceleration controller or flight/output permission. Relative drift bounds |d(validator time)/d(producer time)-1| in integer ppm. Timestamp uncertainty includes declared timestamp, quantization and translator errors. The local map must conservatively include measured round-trip uncertainty and drift over its entire frozen producer interval, within SLA_CMP_CLOCK_U. Stock TIMESYNC convergence alone is not this guarantee; these declared bounds need deployment evidence. No offset, session or map epoch is configured by a parameter."
          },
          "type": "int32",
          "min": 0,
          "max": 60000000,
          "default": 0,
          "unit": "us"
        }
      }
    },
