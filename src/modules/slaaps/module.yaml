            "short": "Positive maximum force residual body X; zero is unconfigured",
            "long": "SLAAPS vehicle configuration. Edit while disabled and apply a complete validated configuration before mode entry. Zero physical defaults are unconfigured, not vehicle measurements. Saving parameters does not establish flight readiness. Optional measured physical affine wrench, declared explicitly by SLA_WR_EN. All vectors use body FRD; moments are about CG. Canard force derivatives are N/rad and reuse the existing signed rad/normalized deflection slopes and moment derivatives. Total nongravitational trim wrench is measured at the configured canard trims and SLA_TEST_THR for the fixed model, or at the shared EDF thrust curve value for that scheduled corner's EDF-command knot. Installed EDF force/N and moment/N include measured installation effects; no unit-vector normalization, lever arm, torque or wash is inferred. Individual measured coefficients may be zero. Interpolate complete affine intercepts and columns at the same filtered schedule coordinates; do not interpolate reference products. Positive force/moment residual tolerances are explicit physical acceptance bounds. Disabled or incomplete wrench data leaves acceleration conversion unavailable without removing Manual or Bench calibration. Declaration, parameter saving and numerical validity do not prove measurement authenticity, operating-envelope coverage or flight/output admission."
